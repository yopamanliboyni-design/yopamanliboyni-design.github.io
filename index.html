<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabina uchun maxsus...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="loveAudio" loop>
        <source src="Konsta Dilnoz U haqida (LIVE).m4a" type="audio/mp4">
    </audio>

    <div class="card" id="mainCard">
        <h1 id="title">Sabina... ❤️</h1>
        <p id="text">Sen mening dunyoyimsan! Men bilan birga bo‘lishga rozimisan?</p>
        <div class="buttons" id="btnContainer">
            <button id="yesBtn" onclick="document.getElementById('loveAudio').play(); nextPage()">Ha</button>
            <button id="noBtn" onmouseover="moveButton()">Yo‘q</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const card = document.getElementById('mainCard');
            const maxX = card.clientWidth - noBtn.clientWidth - 20;
            const maxY = card.clientHeight - noBtn.clientHeight - 20;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function nextPage() {document.getElementById('loveAudio').play();

            document.getElementById('title').innerText = "Uraaa! 🎉";
            document.getElementById('text').innerText = "Seni judayam yaxshi ko‘raman! ❤️ Buni bilishingni xohlagandim.";
            document.getElementById('btnContainer').style.display = 'none';
        }
    </script>
</body>
</html>
