<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabina uchun maxsus...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(212, 116, 116, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }

        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff477e;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff5c8a;
        }

        #noBtn {
            background-color: #ffffff;
            color: #ff477e;
            position: absolute;
            right: 50px;
        }

        /* Uchuvchi yurakchalar */
        .heart {
            position: absolute;
            color: #ff7096;
            animation: fly 5s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes fly {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1 id="title">Sabina... ❤️</h1>
        <p id="text">Sen mening dunyoyimsan. Har bir kunimni baxtga to'ldirayotganing uchun rahmat! Men bilan birga umrbod baxtli bo'lishga rozimisan?</p>
        <div class="buttons" id="btnContainer">
            <button id="yesBtn" onclick="celebrate()">Ha</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Yo'q</button>
        </div>
    </div>

    <script>
        // Qochadigan tugma funksiyasi
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const card = document.getElementById('mainCard');
            
            // Tugmani karta ichida tasodifiy joyga ko'chirish
            const maxX = card.clientWidth - noBtn.clientWidth - 20;
            const maxY = card.clientHeight - noBtn.clientHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // "Ha" bosilgandagi tabrik
        function celebrate() {
            document.getElementById('title').innerHTML = "Uraaa! 🎉❤️";
            document.getElementById('text').innerHTML = "Sening bu javobing meni dunyodagi eng baxtli insonga aylantirdi, Sabinam! Seni judayam yaxshi ko'raman va har doim asrab-avaylayman! 🌟";
            document.getElementById('btnContainer').style.display = 'none';
            
            // Ko'proq yurakchalar paydo qilish
            setInterval(createHeart, 100);
        }

        // Uchuvchi yurakchalar yaratish
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Sahifa ochilishi bilan fonda sekin yurakchalar uchib turishi
        setInterval(createHeart, 400);
    </script>
</body>
</html>
